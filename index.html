<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ToDo Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="mb-0">📝 To-Do Manager</h2>
      <button id="themeToggle" class="btn btn-outline-secondary btn-sm">🌙 Toggle Dark Mode</button>
    </div>

    <div class="input-group mb-4">
      <input id="taskInput" type="text" class="form-control" placeholder="Add a new task" />
      <button class="btn btn-success" onclick="addTask()">Add</button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0">Your Tasks</h5>
      <button class="btn btn-outline-danger btn-sm" onclick="clearTasks()">Clear All</button>
    </div>

    <ul id="taskList" class="list-group"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
